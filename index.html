
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

    <title>NEGOCIO - System Initialization</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --pixel-font: 'Press Start 2P', cursive;
            --bg-beige: #f5f5dc;
            --accent-pink: #e2a9be;
            --deep-rose: #b07d8e;
            --text-main: #4a4a4a;
            --border-color: #d1d1bc;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #e8e8d0;
            color: var(--text-main);
            overflow: hidden;
            font-family: var(--pixel-font);
            image-rendering: pixelated;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                rgba(0, 0, 0, 0.03) 50%,
                transparent 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
        }

        #c64-container,
        #dashboard,
        #app-window {
            position: fixed;
            inset: 0;
            background-color: var(--bg-beige);
            border: 16px solid var(--border-color);
            outline: 3px solid white;
            outline-offset: -10px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            transition: opacity 0.4s ease-in-out;
        }

        .system-text {
            font-size: 0.75rem;
            line-height: 2.5;
            text-transform: uppercase;
            color: var(--deep-rose);
            word-break: break-word;
        }

        .command-line {
            display: flex;
            align-items: center;
            margin-top: 20px;
            color: var(--text-main);
            flex-wrap: wrap;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--accent-pink);
            animation: blink 0.8s infinite steps(2);
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        #dashboard,
        #app-window {
            display: none;
            opacity: 0;
            z-index: 10;
            align-items: center;
            justify-content: center;
        }

        #dashboard.visible,
        #app-window.visible {
            display: flex;
            opacity: 1;
        }

        .enter-btn {
            background: white;
            border: 4px solid var(--accent-pink);
            color: var(--deep-rose);
            padding: 16px 40px;
            font-family: var(--pixel-font);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--accent-pink);
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .enter-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .negocio-box {
            border: 2px solid var(--deep-rose);
            padding: 8px 24px;
            margin-bottom: 20px;
            color: var(--deep-rose);
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
        }

        .donkey-container {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .window-header {
            border-bottom: 2px solid var(--accent-pink);
            width: 100%;
            padding: 8px 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.55rem;
        }

        #start-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-beige);
            color: var(--deep-rose);
            cursor: pointer;
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 640px) {
            #c64-container,
            #dashboard,
            #app-window {
                border-width: 8px;
                outline-width: 2px;
                outline-offset: -5px;
                padding: 16px;
            }

            .system-text {
                font-size: 0.55rem;
                line-height: 2.2;
            }

            .enter-btn {
                padding: 14px 24px;
                font-size: 0.75rem;
                width: 100%;
                max-width: 260px;
            }

            .negocio-box {
                font-size: 0.6rem;
                letter-spacing: 3px;
                padding: 6px 16px;
            }

            .donkey-container {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>

<body>

    <div class="scanlines"></div>

    <div id="start-overlay">
        <p>[ TAP ANYWHERE TO INITIALIZE ]</p>
    </div>

    <div id="c64-container">

        <div class="system-text">
            ** SYSTEM LOADED **<br>
            STATION: BEIGE_CORE_01<br>
            STATUS: SECURE
        </div>

        <div class="command-line">
            <span id="typed-command"></span>
            <span class="cursor"></span>
        </div>

    </div>

    <div id="dashboard">

        <header class="mb-8 text-center flex flex-col items-center">

            <div class="donkey-container">
                <svg viewBox="0 0 16 16"
                     width="100%"
                     height="100%"
                     shape-rendering="crispEdges">

                    <rect x="5" y="7" width="8" height="5" fill="#a0a0a0"/>
                    <rect x="13" y="6" width="1" height="3" fill="#a0a0a0"/>
                    <rect x="4" y="4" width="3" height="4" fill="#a0a0a0"/>
                    <rect x="2" y="5" width="2" height="3" fill="#a0a0a0"/>
                    <rect x="5" y="12" width="1" height="3" fill="#a0a0a0"/>
                    <rect x="7" y="12" width="1" height="3" fill="#a0a0a0"/>
                    <rect x="10" y="12" width="1" height="3" fill="#a0a0a0"/>
                    <rect x="12" y="12" width="1" height="3" fill="#a0a0a0"/>

                </svg>
            </div>

            <div class="negocio-box">
                NEGOCIO
            </div>

            <p class="text-[0.6rem] uppercase tracking-[0.15em] text-[#b07d8e]">
                Welcome, Authorized User
            </p>

        </header>

        <button class="enter-btn" id="enter-button">
            ENTER
        </button>

    </div>

    <div id="app-window">

        <div class="window-header">

            <span>TERMINAL // MAIN_VIEW</span>

            <button
                onclick="backToMain()"
                style="cursor:pointer;color:var(--deep-rose);background:none;border:none;font-family:var(--pixel-font);font-size:0.55rem;">
                [ ESC ]
            </button>

        </div>

        <div class="text-center">

            <p class="text-xs text-[#b07d8e]">
                REDIRECTING...
            </p>

            <p class="text-[0.5rem] mt-4 opacity-60">
                ANALYZING DEVICE ARCHITECTURE
            </p>

        </div>

    </div>

    <script>

        let audioCtx = null;
        let bgMusic = null;

        let sequenceStarted = false;
        let redirectStarted = false;

        function initializeAudio() {
            try {
                const AudioContextClass =
                    window.AudioContext || window.webkitAudioContext;

                if (AudioContextClass && !audioCtx) {
                    audioCtx = new AudioContextClass();
                }

                if (audioCtx && audioCtx.state === "suspended") {
                    audioCtx.resume().catch(() => {});
                }

            } catch (error) {
                audioCtx = null;
            }
        }

        function playC64Key() {

            if (!audioCtx || audioCtx.state !== "running") return;

            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "triangle";

            osc.frequency.setValueAtTime(80, now);

            gain.gain.setValueAtTime(0.08, now);

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.08
            );

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        }

        function playBootSound() {

            if (!audioCtx || audioCtx.state !== "running") return;

            const now = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "sine";

            osc.frequency.setValueAtTime(440, now);

            osc.frequency.exponentialRampToValueAtTime(
                880,
                now + 0.2
            );

            gain.gain.setValueAtTime(0.05, now);

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 0.3
            );

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playIntroMusic() {

            try {

                bgMusic = new Audio(
                    "https://www.soundjay.com/buttons/beep-01a.mp3"
                );

                bgMusic.volume = 0.3;

                bgMusic.play().catch(() => {});

                setTimeout(() => {
                    fadeMusic();
                }, 15000);

            } catch (error) {
                console.log("Audio unavailable");
            }
        }

        function fadeMusic() {

            if (!bgMusic) return;

            const fadeInterval = setInterval(() => {

                if (bgMusic.volume > 0.02) {

                    bgMusic.volume = Math.max(
                        0,
                        bgMusic.volume - 0.02
                    );

                } else {

                    bgMusic.pause();
                    clearInterval(fadeInterval);

                }

            }, 150);
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function runSequence() {

            if (sequenceStarted) return;

            sequenceStarted = true;

            initializeAudio();

            const overlay = document.getElementById("start-overlay");

            overlay.style.display = "none";

            const display = document.getElementById("typed-command");

            const command = "BOOT SEQUENCE";

            playIntroMusic();

            await delay(400);

            for (const char of command) {

                display.innerText += char;

                playC64Key();

                await delay(80);
            }

            await delay(400);

            playBootSound();

            const terminal = document.getElementById("c64-container");

            terminal.style.opacity = "0";

            await delay(400);

            terminal.style.display = "none";

            document.getElementById("dashboard").classList.add("visible");
        }

        function detectDevice() {

            const userAgent = navigator.userAgent || "";

            const mobileDevice =
                /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);

            const smallScreen =
                window.matchMedia("(max-width: 767px)").matches;

            return mobileDevice || smallScreen;
        }

        function detectAndRedirect() {

            if (redirectStarted) return;

            redirectStarted = true;

            initializeAudio();

            playBootSound();

            document.getElementById("dashboard").classList.remove("visible");

            document.getElementById("app-window").classList.add("visible");

            const isMobile = detectDevice();

            const mobileFile =
                "./NEGOCIO MOBILE final product.html";

            const pcFile =
                "./NEGOCIO PC FINAL PRODUCT.html";

            const targetFile = isMobile ? mobileFile : pcFile;

            console.log("Device detected:", isMobile ? "MOBILE" : "PC");

            console.log("Redirecting to:", targetFile);

            setTimeout(() => {

                window.location.assign(
                    new URL(targetFile, window.location.href).href
                );

            }, 800);
        }

        function backToMain() {

            playC64Key();

            document.getElementById("app-window").classList.remove("visible");

            document.getElementById("dashboard").classList.add("visible");
        }

        document.addEventListener("DOMContentLoaded", () => {

            document.getElementById("start-overlay")
                .addEventListener("click", runSequence);

            document.getElementById("enter-button")
                .addEventListener("click", detectAndRedirect);

        });

    </script>

</body>
</html>
