<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <h3>Opening website...</h3>

    <script>
        const mobilePage = "mobile.html";
        const desktopPage = "pc.html";

        const isMobile = /Android|iPhone|iPad|iPod|Mobile|Tablet|IEMobile|Opera Mini/i
            .test(navigator.userAgent);

        if (isMobile) {
            window.location.replace(mobilePage);
        } else {
            window.location.replace(desktopPage);
        }
    </script>

</body>
</html>
